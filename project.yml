name: EchoEngine

options:
  deploymentTarget:
    iOS: "26.0"
  developmentLanguage: en
  createIntermediateGroups: true
  xcodeVersion: "27.1"

packages:
  EchoCore:
    path: Packages/EchoCore

settings:
  base:
    SWIFT_VERSION: "6.0"
    # EchoCore modules are built with C++ interop; every Swift module importing them must enable it too.
    SWIFT_OBJC_INTEROP_MODE: objcxx
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  EchoEngine:
    type: application
    platform: iOS
    sources:
      - path: App-iOS
    dependencies:
      - package: EchoCore
        product: EchoCore
      - package: EchoCore
        product: EchoAudioUnits
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: akumatech.Echo-Engine
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
        # No AppIcon set until F16.T01; restore "AppIcon" there.
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Echo Engine
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: >-
          UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown
          UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
    scheme:
      testTargets:
        - EchoEngineTests

  EchoEngineTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: App-iOSTests
    dependencies:
      - target: EchoEngine
      - package: EchoCore
        product: EchoCoreFakes
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: akumatech.Echo-Engine.tests
        GENERATE_INFOPLIST_FILE: YES
