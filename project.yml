name: EchoEngine

options:
  deploymentTarget:
    iOS: "26.0"
  developmentLanguage: en
  createIntermediateGroups: true
  xcodeVersion: "27.1"

packages:
  EchoCore:
    path: Packages/EchoCore
  # Analytics and crash reports behind consent (SPEC § 4.9, § 16): only these two products, no ad-ID support.
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    exactVersion: 13.1.1

settings:
  base:
    SWIFT_VERSION: "6.0"
    # EchoCore modules are built with C++ interop; every Swift module importing them must enable it too.
    SWIFT_OBJC_INTEROP_MODE: objcxx
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES

targets:
  EchoEngine:
    type: application
    platform: iOS
    sources:
      - path: App-iOS
      # Live Activity types shared with the widget extension (SPEC § 13.7).
      - path: Shared/RecordingActivity
    # Keys without an INFOPLIST_KEY_ build setting; merged with the generated Info.plist.
    info:
      path: App-iOS/Info.plist
      properties:
        UIBackgroundModes: [audio]
        # Nothing is collected before consent (SPEC § 16); the app turns collection on per the person's answer.
        FIREBASE_ANALYTICS_COLLECTION_ENABLED: false
        FirebaseCrashlyticsCollectionEnabled: false
        GOOGLE_ANALYTICS_DEFAULT_ALLOW_AD_PERSONALIZATION_SIGNALS: false
        GOOGLE_ANALYTICS_ADID_COLLECTION_ENABLED: false
        # Exports continue in the background as BGContinuedProcessingTasks (SPEC § 11.2 step 7).
        BGTaskSchedulerPermittedIdentifiers: [akumatech.Echo-Engine.export.*]
    dependencies:
      - package: EchoCore
        product: EchoCore
      - package: EchoCore
        product: EchoAudioUnits
      # Previews and debug-only sample projects (SPEC § 4.1, § 20).
      - package: EchoCore
        product: EchoCoreFakes
      # The recording Live Activity (SPEC § 4.2, § 13.7).
      - target: RecordingWidget
      - package: Firebase
        product: FirebaseAnalytics
      - package: Firebase
        product: FirebaseCrashlytics
    postBuildScripts:
      # Readable crash reports (SPEC § 16): Release builds that include GoogleService-Info.plist only.
      - name: Upload dSYMs to Crashlytics
        basedOnDependencyAnalysis: false
        script: |
          if [ "${CONFIGURATION}" != "Release" ]; then exit 0; fi
          if [ ! -f "${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/GoogleService-Info.plist" ]; then
            echo "warning: No GoogleService-Info.plist in the app: dSYMs not uploaded (SPEC § 16)."
            exit 0
          fi
          "${BUILD_DIR%/Build/*}/SourcePackages/checkouts/firebase-ios-sdk/Crashlytics/run"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: akumatech.Echo-Engine
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        # Personal Team (free): no iCloud capability, 7-day device profiles (SPEC § 3, § 20).
        DEVELOPMENT_TEAM: L9B6N63T2Q
        ENABLE_PREVIEWS: YES
        # No AppIcon set until F16.T01; restore "AppIcon" there.
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Echo Engine
        INFOPLIST_KEY_NSMicrophoneUsageDescription: >-
          Echo Engine uses the microphone to record audio. Your recordings stay on your device.
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: Echo Engine saves exported videos to your photo library.
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
        # Crashlytics' upload script reads the SDK checkout and the dSYMs (Firebase requires it off for this target).
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: >-
          UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown
          UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
    scheme:
      testTargets:
        - EchoEngineTests

  # Widget extension with only the recording Live Activity (SPEC § 4.2, § 13.7). Shares the app's asset catalog for
  # the color tokens; links no EchoCore product, so it stays small.
  RecordingWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: RecordingWidget
      - path: Shared/RecordingActivity
      - path: App-iOS/Resources/Assets.xcassets
    info:
      path: RecordingWidget/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: akumatech.Echo-Engine.RecordingWidget
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: L9B6N63T2Q
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Echo Engine
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        SKIP_INSTALL: YES
        # Plain Swift; the shared Live Activity files import nothing from EchoCore.
        SWIFT_OBJC_INTEROP_MODE: objc

  EchoEngineTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: App-iOSTests
    # Link nothing from EchoCore here: the host app already links EchoCore and EchoCoreFakes, and a second
    # copy in the test bundle duplicates their types (breaks `as?`, `is` and `catch` across the two).
    dependencies:
      - target: EchoEngine
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: akumatech.Echo-Engine.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  # Runs the app in Xcode's right-to-left pseudolanguage (SPEC § 17).
  EchoEngine-RTL:
    build:
      targets:
        EchoEngine: all
    run:
      config: Debug
      commandLineArguments:
        "-AppleTextDirection YES": true
        "-NSForceRightToLeftWritingDirection YES": true
