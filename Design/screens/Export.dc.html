<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Echo Engine export</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#F0B24A}a:hover{color:#F6C978}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #0C0F14; color: #ECEFF3; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif">

  <div style="position: absolute; left: 0; right: 0; bottom: 0; top: 70px; box-sizing: border-box; border-radius: 28px 28px 0 0; background: #1A2029; border-top: 1px solid #2B3340; padding: 10px 20px 34px 20px; display: flex; flex-direction: column; gap: 20px">
    <div style="align-self: center; width: 38px; height: 5px; border-radius: 3px; background: #3A4452"></div>

    <div style="display: flex; align-items: center; justify-content: space-between">
      <h1 style="margin: 0; font-size: 24px; font-weight: 700">Export</h1>
      <a href="Editor.dc.html" aria-label="Close" style="width: 36px; height: 36px; border-radius: 18px; background: #29313D; color: #C9D1DB; display: flex; align-items: center; justify-content: center">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
      </a>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 14px; font-weight: 600; color: #A3ADBA">Export as</span>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 12px; background: #11161D">
        <sc-for list="{{outputs}}" as="o" hint-placeholder-count="3">
          <button style="height: 38px; border: none; border-radius: 9px; background: {{o.bg}}; color: {{o.fg}}; font-family: inherit; font-size: 14px; font-weight: 600">{{o.label}}</button>
        </sc-for>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 14px; font-weight: 600; color: #A3ADBA">Audio quality</span>
      <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 12px; background: #11161D">
        <sc-for list="{{qualities}}" as="q" hint-placeholder-count="4">
          <button style="height: 38px; border: none; border-radius: 9px; background: {{q.bg}}; color: {{q.fg}}; font-family: inherit; font-size: 13px; font-weight: 600">{{q.label}}</button>
        </sc-for>
      </div>
      <span style="font-size: 13px; color: #A3ADBA">AAC 320 kbps. The video is kept exactly as it is.</span>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 14px; font-weight: 600; color: #A3ADBA">Save to</span>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
        <sc-for list="{{destinations}}" as="d" hint-placeholder-count="3">
          <button style="height: 68px; border-radius: 14px; border: 1.5px solid {{d.border}}; background: #222A35; color: {{d.fg}}; font-family: inherit; font-size: 13px; font-weight: 600; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px">
            <sc-if value="{{d.isPhotos}}" hint-placeholder-val="{{ false }}">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"></rect><circle cx="9" cy="10" r="2"></circle><path d="M21 16l-5-5-9 9"></path></svg>
            </sc-if>
            <sc-if value="{{d.isFiles}}" hint-placeholder-val="{{ false }}">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>
            </sc-if>
            <sc-if value="{{d.isShare}}" hint-placeholder-val="{{ false }}">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M7 8l5-5 5 5"></path><path d="M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"></path></svg>
            </sc-if>
            {{d.label}}
          </button>
        </sc-for>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 14px; font-weight: 600; color: #A3ADBA">After export</span>
      <div style="display: flex; flex-direction: column; border-radius: 14px; background: #222A35; overflow: hidden">
        <sc-for list="{{afters}}" as="a" hint-placeholder-count="3">
          <button style="display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 0 14px; border: none; border-bottom: 1px solid #2B3340; background: transparent; color: inherit; font-family: inherit; text-align: left">
            <span style="width: 20px; height: 20px; box-sizing: border-box; border-radius: 10px; border: {{a.ring}}"></span>
            <span style="flex: 1; font-size: 15px; font-weight: 600">{{a.label}}</span>
            <span style="font-size: 13px; color: #A3ADBA">{{a.note}}</span>
          </button>
        </sc-for>
      </div>
    </div>

    <div style="margin-top: auto; display: flex; flex-direction: column; gap: 10px">
      <span style="font-size: 13px; color: #A3ADBA; text-align: center">Needs about 1.2 GB. 18.4 GB available.</span>
      <button style="height: 54px; border: none; border-radius: 16px; background: {{accent}}; color: #1E1505; font-family: inherit; font-size: 17px; font-weight: 600">Export video</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#F0B24A","options":["#F0B24A","#5CC8D8","#9B8CFF","#7FD18B"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#F0B24A';
    const seg = (labels, sel) => labels.map((label) => ({
      label,
      bg: label === sel ? '#323B48' : 'transparent',
      fg: label === sel ? '#ECEFF3' : '#A3ADBA'
    }));
    const outputs = seg(['Video', 'Audio only', 'Both'], 'Video');
    const qualities = seg(['Standard', 'High', 'Lossless', 'Custom'], 'High');
    const destinations = ['Photos', 'Files', 'Share'].map((label) => ({
      label,
      isPhotos: label === 'Photos', isFiles: label === 'Files', isShare: label === 'Share',
      border: label === 'Photos' ? accent : '#2B3340',
      fg: label === 'Photos' ? '#ECEFF3' : '#A3ADBA'
    }));
    const afters = [
      { label: 'Keep project', note: '', on: true },
      { label: 'Keep, clear cache', note: 'Frees 0.4 GB', on: false },
      { label: 'Delete project', note: 'Frees 1.4 GB', on: false }
    ].map((a) => ({ ...a, ring: a.on ? '6px solid ' + accent : '2px solid #4A5563' }));
    return { accent, outputs, qualities, destinations, afters };
  }
}
</script>
</body>
</html>
