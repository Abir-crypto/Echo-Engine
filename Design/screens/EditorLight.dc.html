<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Echo Engine editor, light</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#8A5A00}a:hover{color:#6B4500}
</style>
</helmet>
<div style="width: 390px; height: 1000px; box-sizing: border-box; position: relative; overflow: hidden; background: #F3F5F8; color: #141A22; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif; display: flex; flex-direction: column; gap: 18px; padding: 56px 20px 32px 20px">

  <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
    <a href="Home.dc.html" aria-label="Back to projects" style="width: 44px; height: 44px; border-radius: 22px; background: #FFFFFF; color: #3A4452; display: flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
    </a>
    <span style="font-size: 17px; font-weight: 600">Beach vlog</span>
    <a href="Export.dc.html" style="height: 40px; padding: 0 16px; border-radius: 20px; background: {{accent}}; color: #1E1505; text-decoration: none; font-size: 15px; font-weight: 600; display: flex; align-items: center">Export</a>
  </div>

  <div style="height: 197px; border-radius: 16px; background: #DDE2E9; border: 1px solid #CED5DE; display: flex; align-items: center; justify-content: center; color: #8591A0; font-size: 13px">Video preview</div>

  <div style="display: flex; align-items: center; justify-content: space-between">
    <button style="height: 40px; padding: 0 14px; border-radius: 20px; border: 1px solid #C6CDD6; background: transparent; color: #3A4452; font-family: inherit; font-size: 13px; font-weight: 600">Hold for original</button>
    <button aria-label="Play" style="width: 56px; height: 56px; border-radius: 28px; border: none; background: #141A22; color: #F3F5F8; display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4.5v15l13-7.5z"></path></svg>
    </button>
    <div style="display: flex; gap: 6px">
      <button aria-label="Undo" style="width: 40px; height: 40px; border-radius: 20px; border: none; background: #FFFFFF; color: #3A4452; display: flex; align-items: center; justify-content: center">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14L4 9l5-5"></path><path d="M4 9h11a5 5 0 0 1 0 10h-3"></path></svg>
      </button>
      <button aria-label="Redo" style="width: 40px; height: 40px; border-radius: 20px; border: none; background: #FFFFFF; color: #8A94A1; display: flex; align-items: center; justify-content: center">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 14l5-5-5-5"></path><path d="M20 9H9a5 5 0 0 0 0 10h3"></path></svg>
      </button>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 6px">
    <div style="position: relative; height: 68px; border-radius: 12px; background: #FFFFFF; overflow: hidden; display: flex; align-items: center; gap: 2px; padding: 0 6px">
      <sc-for list="{{bars}}" as="b" hint-placeholder-count="56">
        <div style="flex: 1; border-radius: 2px; height: {{b.h}}; background: {{b.color}}"></div>
      </sc-for>
      <div style="position: absolute; left: 0; top: 0; bottom: 0; width: 34px; background: rgba(243,245,248,0.72)"></div>
      <div style="position: absolute; right: 0; top: 0; bottom: 0; width: 46px; background: rgba(243,245,248,0.72)"></div>
      <div style="position: absolute; left: 30px; top: 0; bottom: 0; width: 8px; border-radius: 4px; background: {{accent}}"></div>
      <div style="position: absolute; right: 42px; top: 0; bottom: 0; width: 8px; border-radius: 4px; background: {{accent}}"></div>
      <div style="position: absolute; left: 132px; top: -2px; bottom: -2px; width: 2px; background: #141A22"></div>
    </div>
    <div style="display: flex; justify-content: space-between; font-size: 12px; color: #5B6573; font-variant-numeric: tabular-nums">
      <span>0:42</span>
      <span>Trimmed to 2:51 of 3:18</span>
    </div>
  </div>

  <section style="display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; align-items: baseline; justify-content: space-between">
      <h2 style="margin: 0; font-size: 20px; font-weight: 700">Enhance</h2>
      <span style="font-size: 13px; color: #5B6573">Applied top to bottom</span>
    </div>
    <div style="display: flex; flex-direction: column; border-radius: 14px; background: #FFFFFF; overflow: hidden">
      <sc-for list="{{stack}}" as="s" hint-placeholder-count="2">
        <div style="display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 0 14px; border-bottom: 1px solid #E6EAF0">
          <span style="width: 24px; height: 24px; border-radius: 12px; background: rgba(240,178,74,0.22); color: {{accentText}}; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center; font-variant-numeric: tabular-nums">{{s.n}}</span>
          <div style="flex: 1; display: flex; flex-direction: column; gap: 2px">
            <span style="font-size: 16px; font-weight: 600">{{s.name}}</span>
            <sc-if value="{{s.hint}}" hint-placeholder-val="{{ false }}">
              <span style="font-size: 12px; color: #5B6573">{{s.hint}}</span>
            </sc-if>
          </div>
          <span style="font-size: 15px; color: #3A4452; font-variant-numeric: tabular-nums">{{s.strength}}</span>
          <button aria-label="Reorder {{s.name}}" style="width: 32px; height: 44px; border: none; background: transparent; color: #8A94A1; display: flex; align-items: center; justify-content: center">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 9h14M5 15h14"></path></svg>
          </button>
        </div>
      </sc-for>
      <button style="display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 0 14px; border: none; background: transparent; color: {{accentText}}; font-family: inherit; font-size: 16px; font-weight: 600">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><path d="M12 8v8M8 12h8"></path></svg>
        Add enhancement
      </button>
    </div>
  </section>

  <section style="display: flex; flex-direction: column; gap: 10px">
    <h2 style="margin: 0; font-size: 20px; font-weight: 700">Adjust</h2>
    <div style="display: flex; flex-direction: column; border-radius: 14px; background: #FFFFFF; overflow: hidden">
      <button style="display: flex; align-items: center; gap: 12px; min-height: 60px; padding: 0 14px; border: none; border-bottom: 1px solid #E6EAF0; background: transparent; color: inherit; font-family: inherit; text-align: left">
        <span style="flex: 1; font-size: 16px; font-weight: 600">Equalizer</span>
        <svg width="88" height="28" viewBox="0 0 88 28" fill="none" stroke="{{accent}}" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M2 18 C 14 26, 20 26, 30 16 S 50 6, 60 12 S 78 10, 86 8"></path></svg>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8A94A1" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
      </button>
      <button style="display: flex; align-items: center; gap: 12px; min-height: 60px; padding: 0 14px; border: none; border-bottom: 1px solid #E6EAF0; background: transparent; color: inherit; font-family: inherit; text-align: left">
        <span style="flex: 1; font-size: 16px; font-weight: 600">Gain and dynamics</span>
        <span style="font-size: 15px; color: #3A4452; font-variant-numeric: tabular-nums">+2.5 dB</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8A94A1" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
      </button>
      <button style="display: flex; align-items: center; gap: 12px; min-height: 60px; padding: 0 14px; border: none; background: transparent; color: inherit; font-family: inherit; text-align: left">
        <span style="flex: 1; font-size: 16px; font-weight: 600">Loudness</span>
        <span style="font-size: 15px; color: #3A4452">YouTube</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8A94A1" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
      </button>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#F0B24A","options":["#F0B24A","#5CC8D8","#9B8CFF","#7FD18B"]},"$preview":{"width":390,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#F0B24A';
    const accentText = '#8A5A00';
    const wave = '#D48A12';
    const hs = [22,38,30,55,48,70,42,60,35,78,66,50,84,44,58,92,54,72,30,62,46,76,40,56,34,64,52,80,46,68,38,74,58,88,50,66,32,58,44,70,36,62,54,82,48,64,30,56,42,72,38,60,28,50,36,44];
    const bars = hs.map((h, i) => ({ h: h + '%', color: (i < 4 || i > 50) ? '#BCC4CF' : wave }));
    const stack = [
      { n: '1', name: 'Noise Suppression', strength: '80%', hint: '' },
      { n: '2', name: 'Clear Voice', strength: '100%', hint: 'Already reduces noise' }
    ];
    return { accent, accentText, wave, bars, stack };
  }
}
</script>
</body>
</html>
