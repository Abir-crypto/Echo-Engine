<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Echo Engine record</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#F0B24A}a:hover{color:#F6C978}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #161B22; color: #ECEFF3; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif; display: flex; flex-direction: column; gap: 16px; padding: 64px 20px 0 20px">

  <div style="display: flex; align-items: center; justify-content: space-between">
    <h1 style="margin: 0; font-size: 34px; font-weight: 700; letter-spacing: -0.5px">Record</h1>
    <button style="height: 40px; padding: 0 12px 0 14px; border-radius: 20px; border: none; background: #1F2630; color: #C9D1DB; font-family: inherit; font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 6px">
      USB interface
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>
    </button>
  </div>

  <div style="display: flex; flex-direction: column; border-radius: 14px; background: #1F2630; overflow: hidden">
    <sc-for list="{{settings}}" as="s" hint-placeholder-count="3">
      <button style="display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 0 14px; border: none; border-bottom: 1px solid #29313D; background: transparent; color: inherit; font-family: inherit; text-align: left">
        <span style="flex: 1; font-size: 16px; font-weight: 600">{{s.label}}</span>
        <span style="font-size: 15px; color: {{s.valueColor}}">{{s.value}}</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6B7684" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
      </button>
    </sc-for>
  </div>

  <div style="display: flex; flex-direction: column; align-items: center; gap: 6px; padding-top: 18px">
    <div style="display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; color: #F3A39C">
      <span style="width: 8px; height: 8px; border-radius: 4px; background: #EF5A4F"></span>
      Recording
    </div>
    <span style="font-size: 68px; font-weight: 300; letter-spacing: -1px; font-variant-numeric: tabular-nums">12:47</span>
  </div>

  <div style="display: flex; flex-direction: column; gap: 14px; padding: 4px 0 8px 0">
    <sc-for list="{{channels}}" as="c" hint-placeholder-count="2">
      <div style="display: flex; flex-direction: column; gap: 6px">
        <div style="display: flex; justify-content: space-between; font-size: 13px">
          <span style="font-weight: 600">{{c.name}}</span>
          <span style="color: #A3ADBA; font-variant-numeric: tabular-nums">{{c.db}}</span>
        </div>
        <div style="display: flex; gap: 3px; height: 10px">
          <sc-for list="{{c.segments}}" as="g" hint-placeholder-count="30">
            <div style="flex: 1; border-radius: 2px; background: {{g}}"></div>
          </sc-for>
        </div>
      </div>
    </sc-for>
  </div>

  <p style="margin: 0; padding: 12px 14px; border-radius: 12px; background: #1F2630; font-size: 13px; line-height: 1.45; color: #C9D1DB">Recording continues if you leave the app. Calls or apps that use the microphone may pause it. Your audio so far is always saved.</p>

  <div style="display: flex; align-items: center; justify-content: center; gap: 36px; padding-top: 6px">
    <button aria-label="Pause" style="width: 52px; height: 52px; border-radius: 26px; border: none; background: #1F2630; color: #ECEFF3; display: flex; align-items: center; justify-content: center">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"></rect><rect x="14" y="5" width="4" height="14" rx="1"></rect></svg>
    </button>
    <button aria-label="Stop recording" style="width: 80px; height: 80px; border-radius: 40px; border: 4px solid #ECEFF3; background: transparent; display: flex; align-items: center; justify-content: center; padding: 0">
      <span style="width: 30px; height: 30px; border-radius: 7px; background: #EF5A4F"></span>
    </button>
    <div style="width: 52px; height: 52px"></div>
  </div>

  <nav aria-label="Main" style="position: absolute; left: 50%; bottom: 30px; transform: translateX(-50%); display: flex; gap: 4px; padding: 6px; border-radius: 32px; background: rgba(41,49,61,0.88); border: 1px solid rgba(255,255,255,0.08)">
    <a href="Home.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 2px; width: 96px; padding: 8px 0; border-radius: 26px; color: #A3ADBA; text-decoration: none; font-size: 11px; font-weight: 600">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"></rect><rect x="14" y="3" width="7" height="7" rx="1.5"></rect><rect x="3" y="14" width="7" height="7" rx="1.5"></rect><rect x="14" y="14" width="7" height="7" rx="1.5"></rect></svg>
      Projects
    </a>
    <a href="Record.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 2px; width: 96px; padding: 8px 0; border-radius: 26px; background: rgba(240,178,74,0.14); color: {{accent}}; text-decoration: none; font-size: 11px; font-weight: 600">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0M12 18v3"></path></svg>
      Record
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#F0B24A","options":["#F0B24A","#5CC8D8","#9B8CFF","#7FD18B"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#F0B24A';
    const meter = (lit) => Array.from({ length: 30 }, (_, i) => {
      if (i >= lit) return '#29313D';
      if (i >= 26) return '#EF5A4F';
      return accent;
    });
    const settings = [
      { label: 'Noise reduction', value: 'High', valueColor: '#C9D1DB' },
      { label: 'Auto-tune', value: 'Off', valueColor: '#8591A0' },
      { label: 'Backing track', value: 'None', valueColor: '#8591A0' }
    ];
    const channels = [
      { name: 'Host', db: '−12 dB', segments: meter(19) },
      { name: 'Guest 1', db: '−18 dB', segments: meter(14) }
    ];
    return { accent, settings, channels };
  }
}
</script>
</body>
</html>
